name: Fetch Xuebao Feeds

on:
  schedule:
    # 每天 06:00（北京时间，UTC+8）= UTC 22:00。
    # 2026-09-23 由 09:00 提前：①DeepSeek 空闲计费时段（半价）②用户 09:00 打开即见当日带译文新文章
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feeds-mirror
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch feeds
        run: python fetch_feeds.py

      # 服务端预翻译：无 key / 调用失败时自动跳过或降级，英文版照常投送（翻译不阻塞抓取）
      - name: Translate new articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python translate_feeds.py

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update xuebao feeds"
            git push
          fi
