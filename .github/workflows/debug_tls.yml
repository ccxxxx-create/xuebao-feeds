name: Debug TLS Reachability

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: feeds-debug
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Run diagnostics
        run: python debug_tls.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/debug_tls.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "debug: tls reachability report"
            git push
          fi
